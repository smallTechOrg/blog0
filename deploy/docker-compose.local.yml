# Local verification override (Stage B, spec/architecture.md §12.7) — the production stack on this
# machine, nothing leaves it:
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local.yml \
#     --env-file deploy/local/compose.env up -d --build --wait
# (`pnpm deploy:local` = deploy/local/verify.sh runs the whole proof and tears it down.)
# Differences from production: a local postgres:18 stands in for Cloud SQL (network alias
# `cloud-sql-proxy`, so no URL changes; the proxy is parked behind the `gcp` profile); Mailpit is
# Listmonk's ONLY SMTP (never a real relay); Caddy serves blog.localtest.me / news.localtest.me with
# its own local CA on 8080/8443; committed dev-only env files in deploy/local/. Its own project name,
# volumes and ports — it never touches the dev stack (`blog0`: Listmonk :9000, Postgres :5433).
# Host ports: Caddy 8080/8443; Listmonk admin 127.0.0.1:3491; Postgres 127.0.0.1:3494; Mailpit UI/API 127.0.0.1:3495.
# Relative paths resolve from deploy/ (the first file's directory).
name: blog0-prodlocal

services:
  cloud-sql-proxy:
    profiles: [gcp] # never started locally

  postgres: # the Cloud SQL stand-in: roles blog0 + listmonk own their databases (non-superusers)
    image: postgres:${CLOUD_SQL_MAJOR:-18}
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
    networks:
      default:
        aliases: [cloud-sql-proxy]
    ports: ['127.0.0.1:3494:5432'] # host-side seeding (verify.sh step 4)
    volumes:
      - pgdata-local:/var/lib/postgresql # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker
      - ./local/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d blog0'], interval: 3s, timeout: 3s, retries: 40 }

  mailpit: # SMTP sink: Listmonk's only server; UI/API on 127.0.0.1:3495
    image: axllent/mailpit:v1.31.6 # = the root docker-compose.yml test stack
    environment: { MP_MAX_MESSAGES: '500', TZ: Etc/UTC }
    ports: ['127.0.0.1:3495:8025']
    healthcheck: { test: ['CMD', '/mailpit', 'readyz'], interval: 3s, timeout: 3s, retries: 20 }

  release:
    env_file: !override [local/blog0.env]
    depends_on:
      postgres: { condition: service_healthy }

  blog0:
    env_file: !override [local/blog0.env]
    depends_on:
      postgres: { condition: service_healthy }

  scheduler:
    env_file: !override [local/blog0.env]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - media-backup-local:/backup/media # MEDIA_BACKUP_DEST=/backup/media (deploy/local/compose.env)

  listmonk:
    env_file: !override [local/listmonk.env]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    ports: !override ['127.0.0.1:3491:9000'] # stands in for the SSH tunnel; never the dev :9000

  caddy:
    ports: !override ['127.0.0.1:8080:80', '127.0.0.1:8443:443']

volumes:
  pgdata-local: {}
  media-backup-local: {}
